# Tests, the vectors, the independent seal check, and two builds of tdx-gate whose sha256 must be
# equal. The sha256 is written to the job summary (text for the release notes; no binary is uploaded
# or published). actions/checkout is pinned by commit: 11bd7190... is the tag v4.2.2 (git ls-remote
# https://github.com/actions/checkout refs/tags/v4.2.2). v4 runs on Node 20: move to v5 or later
# before GitHub removes Node 20 from its runners.
name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: make test
      - run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --require-hashes -r python/requirements.lock
          /tmp/venv/bin/pip install --require-hashes -r python/requirements-test.lock
          make pytest PYTHON=/tmp/venv/bin/python
          make sealcheck PYTHON=/tmp/venv/bin/python
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: make repro
      - run: |
          echo '### tdx-gate sha256' >> "$GITHUB_STEP_SUMMARY"
          sha256sum out/repro/a/tdx-gate out/repro/b/tdx-gate | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
